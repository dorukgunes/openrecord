name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Screen-capture and whisper tests skip themselves here: CI has neither TCC grants nor the models.
      - name: Test
        run: swift test

      - name: Build app bundle (ad-hoc signed)
        run: CODESIGN_IDENTITY=- ./scripts/build-app.sh

      - name: MCP smoke test over stdio
        run: OPENRECORD_LIBRARY="$RUNNER_TEMP/empty-library" python3 scripts/mcp_smoke_test.py
